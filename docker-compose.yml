# ============================================================================
# TESTERE STORE — Dokploy Compose stack (REPO KÖKÜ)
# Provider = GitHub/Git (Raw DEĞİL) + Compose Path = docker-compose.yml
#
# DB: postgres + redis UYGULAMANIN İÇİNDE (embedded), özel `internal` ağda.
# Backend onlara servis adıyla (postgres / redis) kesin ulaşır — compose'un
# kendi oluşturduğu ağ olduğu için DNS güvenilir. Managed DB'ye gerek yok.
# Env'de POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD olmalı.
# deploy-marker: v5 (embedded + internal, fresh volume)
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata3:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata2:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./medusa-backend/apps/backend
      dockerfile: ../../../deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DEPLOY_NONCE: "8"
      # İlk deploy'da admin kullanıcısını otomatik oluşturur (varsa geçer).
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # "1" olursa tek seferlik seed (region+kategori+ürün+fiyat+kargo...) arka
      # planda çalışır; marker sonrası tekrar etmez. Seed bitince "0" yapılabilir.
      SEED_ON_BOOT: ${SEED_ON_BOOT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}
      STOREFRONT_URL: ${STOREFRONT_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME}
      IYZICO_API_KEY: ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL}
      IYZICO_CALLBACK_URL: ${IYZICO_CALLBACK_URL}
    volumes:
      - backend_static:/app/.medusa/server/static
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.testere-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.testere-api.entrypoints=websecure"
      - "traefik.http.routers.testere-api.tls.certResolver=letsencrypt"
      - "traefik.http.routers.testere-api.middlewares=testere-api-headers"
      - "traefik.http.services.testere-api.loadbalancer.server.port=9000"
      # ── Güvenlik başlıkları (panel + API) ─────────────────────────────────
      # Admin paneli başka sitede çerçevelenemesin (clickjacking), HSTS,
      # MIME koklama kapalı, "X-Powered-By: Express" parmak izi silinir.
      - "traefik.http.middlewares.testere-api-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.testere-api-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.testere-api-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.testere-api-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.testere-api-headers.headers.customResponseHeaders.X-Powered-By="
      # ── Hız sınırları (IP başına) ─────────────────────────────────────────
      # Giriş / kayıt / şifre sıfırlama: kaba kuvvet şifre denemesine karşı.
      # Eskiden sınırsızdı (dakikada yüzlerce deneme yapılabiliyordu).
      - "traefik.http.middlewares.testere-rl-auth.ratelimit.average=10"
      - "traefik.http.middlewares.testere-rl-auth.ratelimit.period=1m"
      - "traefik.http.middlewares.testere-rl-auth.ratelimit.burst=10"
      - "traefik.http.routers.testere-api-auth.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.testere-api-auth.entrypoints=websecure"
      - "traefik.http.routers.testere-api-auth.tls.certResolver=letsencrypt"
      - "traefik.http.routers.testere-api-auth.middlewares=testere-api-headers,testere-rl-auth"
      - "traefik.http.routers.testere-api-auth.service=testere-api"
      # E-posta gönderen / kayıt açan formlar (iletişim, bülten, yorum,
      # danışman kaydı): spam ve e-posta bombardımanına karşı.
      - "traefik.http.middlewares.testere-rl-forms.ratelimit.average=5"
      - "traefik.http.middlewares.testere-rl-forms.ratelimit.period=1m"
      - "traefik.http.middlewares.testere-rl-forms.ratelimit.burst=5"
      - "traefik.http.routers.testere-api-forms.rule=Host(`${API_DOMAIN}`) && Method(`POST`) && (PathPrefix(`/store/contact`) || PathPrefix(`/store/newsletter`) || PathPrefix(`/store/advisor-signup`) || PathPrefix(`/store/products/`))"
      - "traefik.http.routers.testere-api-forms.entrypoints=websecure"
      - "traefik.http.routers.testere-api-forms.tls.certResolver=letsencrypt"
      - "traefik.http.routers.testere-api-forms.middlewares=testere-api-headers,testere-rl-forms"
      - "traefik.http.routers.testere-api-forms.service=testere-api"
      # http://panel… → https (301). Middleware storefront servisinde tanımlı.
      - "traefik.http.routers.testere-api-http.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.testere-api-http.entrypoints=web"
      - "traefik.http.routers.testere-api-http.middlewares=testere-to-https"

  storefront:
    build:
      context: ./testerestore
      dockerfile: ../deploy/storefront.Dockerfile
      args:
        # Bump edilince storefront yeniden build olur (taze veri: yeni ürünler,
        # güncel resimler). Yeni ürün eklenince artır.
        BUILD_NONCE: ${BUILD_NONCE:-5}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION}
        NEXT_PUBLIC_DEFAULT_CURRENCY: ${NEXT_PUBLIC_DEFAULT_CURRENCY}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}
      # Danışman satın alma vekili backend'e iç ağdan gider ve ziyaretçi IP'sini
      # iletir (hız sınırı herkes için ortak işlemesin diye).
      MEDUSA_INTERNAL_URL: http://backend:9000
      # Danışman sohbeti günlük toplam mesaj tavanı (OpenAI maliyet sınırı).
      ADVISOR_DAILY_LIMIT: ${ADVISOR_DAILY_LIMIT:-3000}
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.testere-web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.testere-web.entrypoints=websecure"
      - "traefik.http.routers.testere-web.tls.certResolver=letsencrypt"
      - "traefik.http.services.testere-web.loadbalancer.server.port=3000"
      # Danışman uçları (OpenAI'ye para harcatan sohbet + kayıt): uygulama
      # içindeki sınıra ek olarak vekil katmanında da IP başına sınır.
      - "traefik.http.middlewares.testere-rl-advisor.ratelimit.average=30"
      - "traefik.http.middlewares.testere-rl-advisor.ratelimit.period=1m"
      - "traefik.http.middlewares.testere-rl-advisor.ratelimit.burst=15"
      - "traefik.http.routers.testere-web-advisor.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/advisor`)"
      - "traefik.http.routers.testere-web-advisor.entrypoints=websecure"
      - "traefik.http.routers.testere-web-advisor.tls.certResolver=letsencrypt"
      - "traefik.http.routers.testere-web-advisor.middlewares=testere-rl-advisor"
      - "traefik.http.routers.testere-web-advisor.service=testere-web"
      # ── Yönlendirmeler (hepsi 301 — SEO sinyali yeni adrese aktarılır) ──────
      # http:// → https:// (apex + www). Eskiden http 404 veriyordu.
      - "traefik.http.middlewares.testere-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.testere-to-https.redirectscheme.permanent=true"
      - "traefik.http.routers.testere-web-http.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.testere-web-http.entrypoints=web"
      - "traefik.http.routers.testere-web-http.middlewares=testere-to-https"
      # https://www.<domain> → https://<domain>. www için DNS A kaydı gerekir;
      # kayıt yokken bu router sertifika alamaz ama apex'i etkilemez.
      - "traefik.http.middlewares.testere-www-to-apex.redirectregex.regex=^https?://www\\.(.+)"
      - "traefik.http.middlewares.testere-www-to-apex.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.testere-www-to-apex.redirectregex.permanent=true"
      - "traefik.http.routers.testere-www.rule=Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.testere-www.entrypoints=websecure"
      - "traefik.http.routers.testere-www.tls.certResolver=letsencrypt"
      - "traefik.http.routers.testere-www.middlewares=testere-www-to-apex"
      # Eski alan adı (OLD_DOMAIN, varsayılan ecommercore.com) → yeni alan adı,
      # yol korunarak: ecommercore.com/products/x → testerestore.com/products/x
      - "traefik.http.middlewares.testere-old-to-new.redirectregex.regex=^https?://(www\\.)?[^/]+/?(.*)"
      - "traefik.http.middlewares.testere-old-to-new.redirectregex.replacement=https://${DOMAIN}/$${2}"
      - "traefik.http.middlewares.testere-old-to-new.redirectregex.permanent=true"
      - "traefik.http.routers.testere-old.rule=Host(`${OLD_DOMAIN:-ecommercore.com}`) || Host(`www.${OLD_DOMAIN:-ecommercore.com}`)"
      - "traefik.http.routers.testere-old.entrypoints=websecure"
      - "traefik.http.routers.testere-old.tls.certResolver=letsencrypt"
      - "traefik.http.routers.testere-old.middlewares=testere-old-to-new"
      - "traefik.http.routers.testere-old-http.rule=Host(`${OLD_DOMAIN:-ecommercore.com}`) || Host(`www.${OLD_DOMAIN:-ecommercore.com}`)"
      - "traefik.http.routers.testere-old-http.entrypoints=web"
      - "traefik.http.routers.testere-old-http.middlewares=testere-old-to-new"

  # ── Şerit Testere Danışmanı (Rules Engine + RAG) ────────────────────────
  # Mevcut servislerin hiçbirine dokunulmadı; bu tamamen eklenti.
  #
  # ÖNEMLİ: bilerek `dokploy-network`e BAĞLANMADI ve traefik label'ı YOK.
  # Yani internetten doğrudan erişilemez. Tarayıcı bu servise hiç konuşmaz;
  # storefront kendi /api/advisor proxy'si üzerinden iç ağdan çağırır.
  # Kazanç: CORS derdi yok, servis URL'i dışarı sızmıyor, /api/chat
  # (her isteği OpenAI'ye para harcayan uç) internete açık değil.
  advisor:
    build:
      context: ./advisor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${ADVISOR_LLM_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${ADVISOR_EMBEDDING_MODEL:-text-embedding-3-small}
      PORT: "5000"
      GUNICORN_THREADS: ${ADVISOR_THREADS:-8}
    volumes:
      # Vektör indeksi — yeniden build'de embedding faturası tekrar çıkmasın
      - advisor_chroma:/app/chroma_db
      # unknown_questions.json / learned_knowledge.json runtime'da yazılıyor;
      # volume olmazsa her deploy'da öğrenilenler silinir
      - advisor_data:/app/data
    networks:
      - internal

  # ── Otomatik yedek ────────────────────────────────────────────────────────
  # Her gün: veritabanı (pg_dump, sıkıştırılmış özel biçim) + ürün görselleri.
  # Veritabanı yedekleri BACKUP_KEEP_DAYS (varsayılan 14) gün, görsel arşivleri
  # 3 gün tutulur. Yedekler aynı sunucuda `db_backups` volume'unda durur —
  # sunucunun kendisi kaybolursa korumaz; Dokploy "Volume Backups" ile S3 vb.
  # bir hedefe de kopyalanmalı (bkz. deploy/DOKPLOY.md → Yedekler).
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - db_backups:/backups
      - backend_static:/static:ro
    networks:
      - internal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          TS=$$(date +%Y-%m-%d_%H%M)
          if pg_dump -Fc -f /backups/db_$$TS.dump.tmp; then
            mv /backups/db_$$TS.dump.tmp /backups/db_$$TS.dump
            echo "[yedek] db_$$TS.dump tamam ($$(du -h /backups/db_$$TS.dump | cut -f1))"
          else
            rm -f /backups/db_$$TS.dump.tmp
            echo "[yedek] HATA: veritabanı yedeği alınamadı"
          fi
          tar -czf /backups/static_$$TS.tar.gz -C /static . && echo "[yedek] static_$$TS.tar.gz tamam"
          find /backups -name 'db_*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          find /backups -name 'static_*.tar.gz' -mtime +3 -delete
          sleep 86400
        done

volumes:
  pgdata3:
  redisdata2:
  backend_static:
  advisor_chroma:
  advisor_data:
  db_backups:

networks:
  internal:
  dokploy-network:
    external: true
